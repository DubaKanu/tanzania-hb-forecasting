# Optional Render Blueprint for the research demonstration API.
# The plan is written out on purpose: leaving "plan" out creates a paid instance.
# Python is fixed to 3.11 because the pinned libraries in requirements.txt have no
# build for Render's newer default Python.
services:
  - type: web
    name: tanzania-hb-forecast-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
